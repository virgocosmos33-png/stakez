<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebGL Fire Rectangle — Controls</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 0 40px;
    box-sizing: border-box;
  }

  .frame {
    position: relative;
    width: 480px;
    height: 720px;
    max-width: 90vw;
    max-height: 60vh;
    overflow: hidden;
  }

  canvas#ring_shape-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .panel {
    width: 480px;
    max-width: 90vw;
    background: #151515;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 18px 20px;
    box-sizing: border-box;
    color: #ddd;
  }

  .panel h3 {
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #888;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .row:last-child { margin-bottom: 0; }

  .row label {
    font-size: 13px;
    color: #bbb;
    min-width: 90px;
  }

  select, input[type="range"] {
    flex: 1;
  }

  select {
    background: #1e1e1e;
    color: #eee;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    outline: none;
  }

  input[type="range"] {
    accent-color: #ff7a1a;
  }

  .speed-val {
    font-size: 12px;
    color: #888;
    min-width: 32px;
    text-align: right;
  }

  .swatches {
    display: flex;
    gap: 8px;
    flex: 1;
    flex-wrap: wrap;
  }

  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    box-sizing: border-box;
  }
  .swatch.active {
    border-color: #fff;
  }
</style>
</head>
<body>

<div class="frame" id="frame">
  <canvas id="ring_shape-canvas"></canvas>
</div>

<div class="panel">
  <h3>Fire Controls</h3>

  <div class="row">
    <label>Color</label>
    <div class="swatches" id="colorSwatches"></div>
  </div>

  <div class="row">
    <label>Speed</label>
    <input type="range" id="speedSlider" min="0" max="3" step="0.05" value="1">
    <div class="speed-val" id="speedVal">1.0x</div>
  </div>

  <div class="row">
    <label>Mask</label>
    <select id="maskSelect">
      <option value="0" selected>None (always lit)</option>
      <option value="1">Bottom → Top</option>
      <option value="2">Top → Bottom</option>
      <option value="3">Clockwise Sweep</option>
      <option value="4">Pulse (fade in/out)</option>
    </select>
  </div>
</div>

<script type="x-shader/x-fragment" id="vertShader">
precision mediump float;

varying vec2 vUv;
attribute vec2 a_position;

void main() {
    vUv = .5 * (a_position + 1.);
    gl_Position = vec4(a_position, 0.0, 1.0);
}
</script>

<script type="x-shader/x-fragment" id="fragShader">
precision mediump float;

varying vec2 vUv;
uniform float u_time;
uniform float u_ratio;
uniform float u_speed;
uniform float u_mask_type;
uniform vec3 u_color_ember;
uniform vec3 u_color_flame;
uniform vec3 u_color_core;

#define TWO_PI 6.28318530718
#define PI 3.14159265358979323846

// ------------------------------------------------
// Generic fractional Brownian motion (fBm) noise

float rand(vec2 n) {
    return fract(cos(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);
}
float noise(vec2 n) {
    const vec2 d = vec2(0.0, 1.0);
    vec2 b = floor(n), f = smoothstep(vec2(0.0), vec2(1.0), fract(n));
    return mix(mix(rand(b), rand(b + d.yx), f.x), mix(rand(b + d.xy), rand(b + d.yy), f.x), f.y);
}
float fbm(vec2 n) {
    float total = 0.0, amplitude = .4;
    for (int i = 0; i < 12; i++) {
        total += noise(n) * amplitude;
        n += n;
        amplitude *= 0.6;
    }
    return total;
}

// ------------------------------------------------

float rounded_box_sdf(vec2 uv, vec2 b, float r) {
    vec2 q = abs(uv) - b + r;
    return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r;
}

float get_ring_shape(vec2 uv, float innerRadius, float outerRadius) {
    vec2 box_half_size = vec2(.42 * u_ratio, .65);
    float corner_radius = .12;
    float distance = rounded_box_sdf(uv, box_half_size, corner_radius) + innerRadius;
    float line_width = outerRadius - innerRadius;
    float ringValue = smoothstep(innerRadius, innerRadius + line_width, distance);
    ringValue -= smoothstep(outerRadius, outerRadius + line_width, distance);
    return clamp(ringValue, 0., 1.);
}

vec2 hash2(vec2 p) {
    p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
    return fract(sin(p) * 43758.5453123);
}

float embers(vec2 uv, float time) {
    float density = 6.;
    vec2 guv = uv * density;
    vec2 cell = floor(guv);
    vec2 f = fract(guv);
    float total = 0.;

    for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
            vec2 offs = vec2(float(x), float(y));
            vec2 id = cell + offs;
            vec2 rnd = hash2(id);

            float speed = .3 + rnd.x * .8;
            float life = fract(time * speed + rnd.y * 6.2831);
            float sway = sin(life * TWO_PI * (1. + rnd.y) + rnd.x * 10.) * .25;
            vec2 particlePos = offs + vec2(.5 + sway, 1.4 * life - .2);

            float d = length(f - particlePos);
            float size = mix(.02, .06, rnd.y);
            float glow = smoothstep(size, size * .1, d);
            float fade = smoothstep(0., .12, life) * smoothstep(1., .8, life);

            total += glow * fade;
        }
    }
    return clamp(total, 0., 1.);
}

void main() {
    vec2 uv = vUv * 2. - 1.;
    uv.x *= u_ratio;

    float noise_scale = 4.;
    float t = .0003 * u_time * u_speed;
    float sec = u_time * .001 * u_speed;

    float atg = atan(uv.y, uv.x);

    vec2 polar_uv = vec2(atg, t + 2.2 * uv.y + 2. / pow(length(uv), .5));
    polar_uv *= noise_scale;
    float noise_left = fbm(polar_uv);
    polar_uv.x = mod(polar_uv.x, noise_scale * TWO_PI);
    float noise_right = fbm(polar_uv);
    float noise = mix(noise_right, noise_left, smoothstep(-.2, .2, uv.x));

    float radius = .55;
    float thickness = .2;
    float ring_shape = get_ring_shape(uv * (.9 + .55 * noise), radius - .8 * thickness, radius + .2 * thickness);

    // ------------------------------------------------
    // Mask templates
    float mask = 1.0;
    float front_glow = 0.0;
    float flash = 0.0;

    float climb_time = 1.2;
    float hold_time = .4;
    float cycle = climb_time + hold_time;
    float local_t = mod(sec, cycle);
    float progress = clamp(local_t / climb_time, 0., 1.);

    if (u_mask_type < .5) {
        // 0: None — always fully lit, no sweep
        mask = 1.0;
    } else if (u_mask_type < 1.5) {
        // 1: Bottom -> Top
        float front_y = mix(-.9, .9, progress);
        mask = 1. - smoothstep(front_y - .15, front_y + .15, uv.y);
        front_glow = 1. - smoothstep(0., .22, abs(uv.y - front_y));
        flash = smoothstep(climb_time - .06, climb_time, local_t) * (1. - smoothstep(climb_time, climb_time + .18, local_t));
    } else if (u_mask_type < 2.5) {
        // 2: Top -> Bottom
        float front_y = mix(.9, -.9, progress);
        mask = 1. - smoothstep(front_y - .15, front_y + .15, -uv.y);
        front_glow = 1. - smoothstep(0., .22, abs(uv.y - front_y));
        flash = smoothstep(climb_time - .06, climb_time, local_t) * (1. - smoothstep(climb_time, climb_time + .18, local_t));
    } else if (u_mask_type < 3.5) {
        // 3: Clockwise angular sweep
        float angle01 = (atg + PI) / TWO_PI; // 0..1 around the ring
        float sweep_cycle = 2.2;
        float sweep_t = mod(sec, sweep_cycle) / sweep_cycle; // 0..1 continuous
        float diff = mod(angle01 - sweep_t + 1.5, 1.0) - 0.5;
        mask = 1. - smoothstep(.0, .35, abs(diff));
        front_glow = 1. - smoothstep(.0, .06, abs(diff));
    } else {
        // 4: Pulse — whole ring fades in and out together
        float wave = .5 + .5 * sin(sec * 2.2);
        mask = smoothstep(.15, .85, wave);
    }

    ring_shape *= mask;

    vec3 fire_color = mix(u_color_ember, u_color_flame, smoothstep(0., .55, ring_shape));
    fire_color = mix(fire_color, u_color_core, smoothstep(.55, 1., ring_shape));

    vec3 color = fire_color * ring_shape;
    color += u_color_core * front_glow * ring_shape * 1.3;
    color += u_color_core * flash * ring_shape * 1.6;

    // scattered rising sparks near the border
    float dist_to_outline = abs(rounded_box_sdf(uv * (.9 + .55 * noise), vec2(.42 * u_ratio, .65), .12));
    float ember_mask = smoothstep(.5, 0., dist_to_outline) * mask;
    float spark = embers(uv, 1.6 * t) * ember_mask;
    vec3 spark_color = mix(u_color_flame, u_color_core, spark);
    color += spark_color * spark;

    gl_FragColor = vec4(color, 1.);
}
</script>

<script>
const canvasEl = document.querySelector("#ring_shape-canvas");
const frameEl = document.querySelector("#frame");

const COLOR_THEMES = [
    { name: "Fire",   swatch: "#ff7a1a", ember: [.5, .03, 0],   flame: [1, .38, .03], core: [1, .92, .55] },
    { name: "Blue",    swatch: "#2f6dff", ember: [.02, .05, .4], flame: [.05, .35, 1], core: [.6, .85, 1] },
    { name: "Green",   swatch: "#38d95a", ember: [.02, .25, .05], flame: [.15, 1, .25], core: [.7, 1, .6] },
    { name: "Violet",  swatch: "#a642ff", ember: [.25, .02, .35], flame: [.55, .05, 1], core: [.85, .6, 1] },
    { name: "White",   swatch: "#f2f2f2", ember: [.35, .35, .35], flame: [.8, .8, .8], core: [1, 1, 1] },
];

let currentColor = COLOR_THEMES[0];
let currentSpeed = 1.0;
let currentMaskType = 1;

const uniforms = {
    timeLocation: null,
    ratioLocation: null,
    speedLocation: null,
    maskTypeLocation: null,
    colorEmberLocation: null,
    colorFlameLocation: null,
    colorCoreLocation: null,
}

const gl = initShader();

render();
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ------------------------------------------------
// UI wiring

const swatchContainer = document.getElementById("colorSwatches");
COLOR_THEMES.forEach((theme, i) => {
    const el = document.createElement("div");
    el.className = "swatch" + (i === 0 ? " active" : "");
    el.style.background = theme.swatch;
    el.title = theme.name;
    el.addEventListener("click", () => {
        currentColor = theme;
        document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
        el.classList.add("active");
        applyColorUniforms();
    });
    swatchContainer.appendChild(el);
});

const speedSlider = document.getElementById("speedSlider");
const speedVal = document.getElementById("speedVal");
speedSlider.addEventListener("input", () => {
    currentSpeed = parseFloat(speedSlider.value);
    speedVal.textContent = currentSpeed.toFixed(2) + "x";
});

const maskSelect = document.getElementById("maskSelect");
maskSelect.addEventListener("change", () => {
    currentMaskType = parseFloat(maskSelect.value);
});

function applyColorUniforms() {
    gl.uniform3f(uniforms.colorEmberLocation, ...currentColor.ember);
    gl.uniform3f(uniforms.colorFlameLocation, ...currentColor.flame);
    gl.uniform3f(uniforms.colorCoreLocation, ...currentColor.core);
}

// ------------------------------------------------

function initShader() {
    const vsSource = document.getElementById("vertShader").innerHTML;
    const fsSource = document.getElementById("fragShader").innerHTML;

    const gl = canvasEl.getContext("webgl") || canvasEl.getContext("experimental-webgl");

    if (!gl) {
        alert("WebGL is not supported by your browser.");
    }

    function createShader(gl, sourceCode, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, sourceCode);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error("An error occurred compiling the shaders: " + gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
        }

        return shader;
    }

    const vertexShader = createShader(gl, vsSource, gl.VERTEX_SHADER);
    const fragmentShader = createShader(gl, fsSource, gl.FRAGMENT_SHADER);

    function createShaderProgram(gl, vertexShader, fragmentShader) {
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error("Unable to initialize the shader program: " + gl.getProgramInfoLog(program));
            return null;
        }

        return program;
    }

    const shaderProgram = createShaderProgram(gl, vertexShader, fragmentShader);

    const vertices = new Float32Array([-1., -1., 1., -1., -1., 1., 1., 1.]);

    const vertexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

    gl.useProgram(shaderProgram);

    const positionLocation = gl.getAttribLocation(shaderProgram, "a_position");
    gl.enableVertexAttribArray(positionLocation);

    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

    uniforms.timeLocation = gl.getUniformLocation(shaderProgram, "u_time");
    uniforms.ratioLocation = gl.getUniformLocation(shaderProgram, "u_ratio");
    uniforms.speedLocation = gl.getUniformLocation(shaderProgram, "u_speed");
    uniforms.maskTypeLocation = gl.getUniformLocation(shaderProgram, "u_mask_type");
    uniforms.colorEmberLocation = gl.getUniformLocation(shaderProgram, "u_color_ember");
    uniforms.colorFlameLocation = gl.getUniformLocation(shaderProgram, "u_color_flame");
    uniforms.colorCoreLocation = gl.getUniformLocation(shaderProgram, "u_color_core");

    gl.useProgram(shaderProgram);
    gl.uniform3f(uniforms.colorEmberLocation, ...currentColor.ember);
    gl.uniform3f(uniforms.colorFlameLocation, ...currentColor.flame);
    gl.uniform3f(uniforms.colorCoreLocation, ...currentColor.core);

    return gl;
}

function render() {
    const currentTime = performance.now();

    gl.uniform1f(uniforms.timeLocation, currentTime);
    gl.uniform1f(uniforms.speedLocation, currentSpeed);
    gl.uniform1f(uniforms.maskTypeLocation, currentMaskType);

    gl.clearColor(0.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    requestAnimationFrame(render);
}

function resizeCanvas() {
    const rect = frameEl.getBoundingClientRect();
    canvasEl.width = rect.width * devicePixelRatio;
    canvasEl.height = rect.height * devicePixelRatio;
    gl.viewport(0, 0, canvasEl.width, canvasEl.height);
    gl.uniform1f(uniforms.ratioLocation, rect.width / rect.height);
}
</script>

</body>
</html>
